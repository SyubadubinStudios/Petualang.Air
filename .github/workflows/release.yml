name: Build and release installers
on:
  push:
    branches: ['main', 'feat/**']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (major.minor.patch); manual runs only create artifacts'
        default: '1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { '1.0.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a vMAJOR.MINOR.PATCH release tag or numeric workflow version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem PetualangAir.Wpf/wwwroot/js/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error: $($_.Name)" }
          }
      - name: Test and package installer
        shell: pwsh
        run: ./tools/build-release.ps1 -Version $env:RELEASE_VERSION
      - name: Upload installer, portable build, and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PetualangAir-windows-${{ env.RELEASE_VERSION }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            targets: --linux --x64
          - os: macos-15
            name: macos
            targets: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Resolve version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { '1.0.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a vMAJOR.MINOR.PATCH release tag or numeric workflow version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Run domain and JavaScript tests
        run: |
          dotnet test PetualangAir.Tests/PetualangAir.Tests.csproj -c Release
          npm test
      - name: Publish WebAssembly build
        working-directory: desktop
        run: |
          npm ci
          npm run build:web -- -p:Version=$RELEASE_VERSION
      - name: Smoke test the Electron host (Linux, software GL under Xvfb)
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          SMOKE_SOFTWARE_GL: '1'
        run: xvfb-run -a --server-args="-screen 0 1366x800x24" npm run smoke
      - name: Smoke test the Electron host (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run smoke
      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.name }}
          path: artifacts/desktop-smoke-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Package
        working-directory: desktop
        run: npm run dist -- ${{ matrix.targets }} -c.extraMetadata.version=$RELEASE_VERSION
      - name: Write checksums
        working-directory: artifacts/desktop
        run: |
          mkdir upload
          mv PetualangAir-*.AppImage PetualangAir-*.tar.gz PetualangAir-*.dmg PetualangAir-*.zip upload/ 2>/dev/null || true
          cd upload
          ls -la
          shasum -a 256 PetualangAir-* > SHA256SUMS-${{ matrix.name }}.txt
      - name: Upload packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PetualangAir-${{ matrix.name }}-${{ env.RELEASE_VERSION }}
          path: artifacts/desktop/upload/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: PetualangAir-*
          merge-multiple: true
          path: release
      - name: Publish tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "Petualang Air $RELEASE_TAG"
          fi
